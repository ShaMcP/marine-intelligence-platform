<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ATLAS Species Trails</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap">

<style>
  :root {
    --bg: #05111e;
    --surface: #091929;
    --border: #0e2a3d;
    --accent: #1a9de0;
    --accent2: #00c9a7;
    --text: #d4e9f7;
    --muted: #527a96;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; }

  header {
    padding: 20px 24px 0;
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 36px; height: 36px; border: 1.5px solid var(--accent);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
    color: var(--accent); letter-spacing: 0.05em; flex-shrink: 0;
  }
  .brand-text h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1; }
  .brand-text p { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; margin-top: 3px; text-transform: uppercase; }

  .subtitle {
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 6px 24px 0;
  }

  .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Mono', monospace;
    font-size: 11px; padding: 7px 14px; border-radius: 4px;
    cursor: pointer; letter-spacing: 0.05em;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn:hover, .btn.active { border-color: var(--accent); color: var(--accent); }
  .btn-play { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 80px; }
  .btn-play:hover { background: #1589c4; border-color: #1589c4; color: #fff; }
  .speed-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

  .trail-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .trail-select {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Mono', monospace;
    font-size: 11px; padding: 6px 10px; border-radius: 4px; cursor: pointer;
  }

  .timeline-bar {
    padding: 12px 24px 0;
    display: flex; align-items: center; gap: 12px;
  }
  .time-display { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent); letter-spacing: 0.08em; min-width: 90px; }
  .progress-track {
    flex: 1; height: 3px; background: var(--border); border-radius: 2px;
    cursor: pointer; position: relative;
  }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; pointer-events: none; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; padding: 12px 24px 20px;
  }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; position: relative;
  }
  .panel-header {
    padding: 10px 14px 8px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  .species-name { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .species-meta { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }
  .obs-count { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent2); }
  canvas { display: block; width: 100%; }

  .iucn-badge {
    font-family: 'DM Mono', monospace; font-size: 9px; padding: 2px 6px;
    border-radius: 3px; border: 1px solid; margin-left: 6px;
  }
  .vu { color: #f5a623; border-color: #f5a623; }
  .en { color: #e05c5c; border-color: #e05c5c; }

  .sst-legend {
    position: absolute; bottom: 10px; right: 10px;
    display: flex; align-items: center; gap: 5px;
  }
  .sst-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); }

  footer { padding: 0 24px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .footer-note { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }
</style>

<header>
  <div class="brand">
    <div class="brand-mark">AT</div>
    <div class="brand-text">
      <h1>ATLAS Marine</h1>
      <p>Animal Tracking &amp; Lifecycle Analysis System</p>
    </div>
  </div>
  <div class="controls">
    <span class="trail-label">Trail</span>
    <select class="trail-select" id="trailLen" onchange="setTrailLen(this.value)">
      <option value="2">2 months</option>
      <option value="4" selected>4 months</option>
      <option value="6">6 months</option>
      <option value="12">12 months</option>
    </select>
    <span class="speed-label">Speed</span>
    <button class="btn" id="speed1" onclick="setSpeed(600)">1×</button>
    <button class="btn active" id="speed2" onclick="setSpeed(300)">2×</button>
    <button class="btn" id="speed4" onclick="setSpeed(120)">4×</button>
    <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶ Play</button>
  </div>
</header>
<div class="subtitle">Movement trails — fading path shows prior months of travel</div>

<div class="timeline-bar">
  <div class="time-display" id="timeDisplay">— — —</div>
  <div class="progress-track" id="progressTrack" onclick="scrubTo(event)">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="grid" id="grid"></div>

<footer>
  <div class="footer-note">Satellite tracking via Movebank · SST: NOAA OI SST V2 · ATLAS Phase 4 Gold layer</div>
  <div class="footer-note">SST: <span style="color:#4da6ff">cool</span> → <span style="color:#00d4aa">warm</span> → <span style="color:#ff6b35">hot</span></div>
</footer>

<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const SPECIES_CONFIG = {
  'Green Turtle':   { iucn:'EN', region:'Western Indian Ocean · Chagos', color:'#00c9a7', latRange:[-25,12], lonRange:[32,78] },
  'Reef Manta Ray': { iucn:'VU', region:'Raja Ampat · Indonesia',        color:'#1a9de0', latRange:[-12,6],  lonRange:[112,135] },
  'Sperm Whale':    { iucn:'VU', region:'Gulf of Mexico',                color:'#a78bfa', latRange:[21,32],  lonRange:[-95,-84] },
  'Whale Shark':    { iucn:'EN', region:'Gulf of Mexico',                color:'#f59e0b', latRange:[17,32],  lonRange:[-100,-80] },
};

function sstColor(sst, alpha) {
  if (sst === null || sst === undefined) return `rgba(255,255,255,${alpha*0.3})`;
  const stops = [[16,[30,100,220]],[22,[0,180,200]],[26,[0,210,140]],[29,[80,200,60]],[30,[255,200,20]],[32,[255,80,20]]];
  let lo=stops[0], hi=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++) {
    if(sst>=stops[i][0]&&sst<=stops[i+1][0]){lo=stops[i];hi=stops[i+1];break;}
  }
  const t=Math.max(0,Math.min(1,(sst-lo[0])/(hi[0]-lo[0])));
  const r=Math.round(lo[1][0]+t*(hi[1][0]-lo[1][0]));
  const g=Math.round(lo[1][1]+t*(hi[1][1]-lo[1][1]));
  const b=Math.round(lo[1][2]+t*(hi[1][2]-lo[1][2]));
  return `rgba(${r},${g},${b},${alpha})`;
}

function latLonToXY(lat,lon,latRange,lonRange,w,h) {
  return [(lon-lonRange[0])/(lonRange[1]-lonRange[0])*w, (1-(lat-latRange[0])/(latRange[1]-latRange[0]))*h];
}

const LAND_MASKS = {
  'Green Turtle': [
    [[[-10,35],[8,41],[10,42],[8,40],[-10,35]]],
    [[[-12,49],[-13,48],[-18,44],[-25,44],[-26,47],[-24,48],[-18,49],[-12,49]]],
  ],
  'Reef Manta Ray': [
    [[[0,132],[0,135],[3,134],[5,131],[5,128],[3,127],[0,132]]],
    [[[-8,115],[-8,118],[-9,119],[-9,117],[-8,115]]],
    [[[-2,120],[-1,122],[0,122],[0,120],[-2,120]]],
  ],
  'Sperm Whale': [
    [[[23,-82],[25,-80],[27,-80],[29,-81],[30,-84],[28,-84],[26,-82],[23,-82]]],
    [[[21,-90],[22,-89],[22,-87],[21,-87],[20,-90],[21,-90]]],
    [[[29,-90],[30,-89],[30,-88],[29,-89],[29,-90]]],
    [[[26,-97],[28,-96],[29,-95],[30,-94],[30,-97],[26,-97]]],
  ],
  'Whale Shark': [
    [[[24,-80],[25,-80],[27,-80],[29,-81],[30,-84],[28,-84],[26,-82],[24,-82],[24,-80]]],
    [[[20,-75],[23,-74],[23,-82],[22,-84],[20,-84],[20,-75]]],
    [[[21,-87],[22,-87],[22,-89],[21,-90],[20,-90],[19,-90],[18,-91],[18,-87],[19,-87],[21,-87]]],
    [[[26,-97],[29,-94],[30,-94],[30,-97],[26,-97]]],
    [[[28,-89],[30,-89],[30,-88],[28,-88],[28,-89]]],
  ],
};

let DATA = null;
let timeline = [];
let currentStep = 0;
let playing = false;
let intervalId = null;
let speed = 300;
let trailLen = 4;
let canvases = {};
let obsCountEls = {};

function setSpeed(ms) {
  speed = ms;
  document.querySelectorAll('.btn[id^="speed"]').forEach(b=>b.classList.remove('active'));
  ({600:'speed1',300:'speed2',120:'speed4'})[ms] && document.getElementById(({600:'speed1',300:'speed2',120:'speed4'})[ms]).classList.add('active');
  if(playing){clearInterval(intervalId);intervalId=setInterval(step,speed);}
}

function setTrailLen(v) { trailLen = parseInt(v); render(); }

function togglePlay() {
  playing = !playing;
  const btn = document.getElementById('playBtn');
  if(playing){
    btn.textContent='⏸ Pause';
    if(currentStep>=timeline.length-1) currentStep=0;
    intervalId=setInterval(step,speed);
  } else {
    btn.textContent='▶ Play';
    clearInterval(intervalId);
  }
}

function step() {
  currentStep=(currentStep+1)%timeline.length;
  render();
  if(currentStep===timeline.length-1){playing=false;clearInterval(intervalId);document.getElementById('playBtn').textContent='▶ Play';}
}

function scrubTo(e) {
  const track=document.getElementById('progressTrack');
  const rect=track.getBoundingClientRect();
  const t=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  currentStep=Math.floor(t*(timeline.length-1));
  render();
}

function buildTimeline(data) {
  const set=new Set();
  for(const sp of Object.values(data))
    for(const yr of Object.keys(sp))
      for(const mo of Object.keys(sp[yr]))
        set.add(`${yr}-${mo.padStart(2,'0')}`);
  return Array.from(set).sort();
}

function getStepsBack(idx, n) {
  // Return array of timeline steps from (idx-n+1) to idx
  const steps = [];
  for(let i = Math.max(0, idx-n+1); i <= idx; i++) steps.push(i);
  return steps;
}

function drawPanel(canvas, sp, stepIdx) {
  const cfg = SPECIES_CONFIG[sp];
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#071828';
  ctx.fillRect(0,0,w,h);

  // Grid
  ctx.strokeStyle='#0b2035'; ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){const y=(i/4)*h;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  for(let i=0;i<=5;i++){const x=(i/5)*w;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}

  // Land
  ctx.fillStyle='#0e2535';
  for(const polygon of (LAND_MASKS[sp]||[])) {
    for(const ring of polygon) {
      ctx.beginPath();
      ring.forEach(([lat,lon],i)=>{
        const [x,y]=latLonToXY(lat,lon,cfg.latRange,cfg.lonRange,w,h);
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      });
      ctx.closePath(); ctx.fill();
    }
  }

  // Trail: draw older steps first, fading
  const steps = getStepsBack(stepIdx, trailLen);
  let totalPts = 0;

  for(let si=0; si<steps.length; si++) {
    const stepI = steps[si];
    const age = steps.length - 1 - si; // 0 = current, trailLen-1 = oldest
    const alpha = 1 - (age / trailLen); // current=1, oldest~0
    const dotAlpha = alpha * 0.9;
    const glowAlpha = alpha * 0.4;
    const dotSize = 2 + alpha * 1.5;

    const key = timeline[stepI];
    if(!key) continue;
    const [yr, mo] = key.split('-');
    const pts = DATA[sp]?.[yr]?.[String(parseInt(mo))] || [];
    if(si===steps.length-1) totalPts = pts.length;

    for(const [lat,lon,sst] of pts) {
      const [x,y] = latLonToXY(lat,lon,cfg.latRange,cfg.lonRange,w,h);
      if(x<-8||x>w+8||y<-8||y>h+8) continue;

      // Glow (only for recent steps)
      if(age < 2) {
        const grad = ctx.createRadialGradient(x,y,0,x,y,8);
        grad.addColorStop(0, sstColor(sst, glowAlpha));
        grad.addColorStop(1,'rgba(0,0,0,0)');
        ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2);
        ctx.fillStyle=grad; ctx.fill();
      }

      // Dot
      ctx.beginPath(); ctx.arc(x,y,dotSize,0,Math.PI*2);
      ctx.fillStyle = sstColor(sst, dotAlpha);
      ctx.fill();
    }
  }

  return totalPts;
}

function render() {
  if(!timeline.length) return;
  const key = timeline[currentStep];
  const [yr, mo] = key.split('-');
  document.getElementById('timeDisplay').textContent = `${MONTHS[parseInt(mo)-1]} ${yr}`;
  const pct=(currentStep/Math.max(1,timeline.length-1))*100;
  document.getElementById('progressFill').style.width=pct+'%';

  for(const [sp, canvas] of Object.entries(canvases)) {
    const pts = drawPanel(canvas, sp, currentStep);
    if(obsCountEls[sp]) obsCountEls[sp].textContent = pts>0?`${pts} obs`:'no data';
  }
}

function init() {
  const grid = document.getElementById('grid');
  const order = ['Green Turtle','Reef Manta Ray','Sperm Whale','Whale Shark'];
  for(const sp of order) {
    const cfg = SPECIES_CONFIG[sp];
    const panel = document.createElement('div');
    panel.className='panel';
    const iucnClass = {EN:'en',VU:'vu'}[cfg.iucn]||'lc';

    panel.innerHTML=`
      <div class="panel-header">
        <div>
          <span class="species-name">${sp}</span>
          <span class="iucn-badge ${iucnClass}">${cfg.iucn}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="species-meta">${cfg.region}</span>
          <span class="obs-count" id="obs-${sp.replace(/ /g,'_')}"></span>
        </div>
      </div>
    `;

    const canvas = document.createElement('canvas');
    canvas.width=500; canvas.height=220;
    canvas.style.width='100%'; canvas.style.height='auto';
    panel.appendChild(canvas);

    // SST legend
    const leg=document.createElement('div'); leg.className='sst-legend';
    const gc2=document.createElement('canvas'); gc2.width=60; gc2.height=6; gc2.className='sst-gradient'; gc2.style.cssText='width:60px;height:6px;border-radius:3px;';
    const gc=gc2.getContext('2d');
    const lg=gc.createLinearGradient(0,0,60,0);
    lg.addColorStop(0,'rgb(30,100,220)'); lg.addColorStop(0.4,'rgb(0,210,140)');
    lg.addColorStop(0.7,'rgb(255,200,20)'); lg.addColorStop(1,'rgb(255,80,20)');
    gc.fillStyle=lg; gc.fillRect(0,0,60,6);
    const l1=document.createElement('span'); l1.className='sst-label'; l1.textContent='18°';
    const l2=document.createElement('span'); l2.className='sst-label'; l2.textContent='32°C';
    leg.append(l1,gc2,l2);
    panel.appendChild(leg);

    grid.appendChild(panel);
    canvases[sp]=canvas;
    obsCountEls[sp]=panel.querySelector(`#obs-${sp.replace(/ /g,'_')}`);
  }

  timeline=buildTimeline(DATA);
  currentStep=0;
  render();
}
</script>
